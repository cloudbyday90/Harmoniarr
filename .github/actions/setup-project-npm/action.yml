name: Set up Harmoniarr npm
description: Sets up the pinned Node and npm versions used by dependency-installing CI jobs.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    - name: Install project npm
      shell: bash
      run: npm install --global npm@12.0.2
    - name: Verify project npm
      shell: bash
      run: npm --version
