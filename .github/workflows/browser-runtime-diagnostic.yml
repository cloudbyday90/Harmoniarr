name: Browser Runtime Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-runtime-diagnostic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  browser-runtime-diagnostic:
    name: Two-worker browser runtime diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up project npm
        uses: ./.github/actions/setup-project-npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run two-worker browser diagnostic
        run: npm run test:browser:diagnostic
        env:
          HARMONIARR_BROWSER_RUNTIME_DIAGNOSTIC: '1'
          HARMONIARR_BROWSER_RUNTIME_DIAGNOSTIC_PATH: browser-runtime-diagnostic/harmoniarr-browser-runtime-diagnostic.json
          HARMONIARR_BROWSER_TEST_CLEANUP_WAIT_MS: 25000
          HARMONIARR_BROWSER_TEST_EVIDENCE_PATH: browser-runtime-diagnostic/harmoniarr-browser-test.json
      - name: Publish browser runtime diagnostic summary
        if: always() && hashFiles('browser-runtime-diagnostic/harmoniarr-browser-runtime-diagnostic.json') != ''
        run: node scripts/write-browser-runtime-diagnostic-summary.js
        env:
          HARMONIARR_BROWSER_RUNTIME_DIAGNOSTIC_PATH: browser-runtime-diagnostic/harmoniarr-browser-runtime-diagnostic.json
          HARMONIARR_BROWSER_RUNTIME_DIAGNOSTIC_SUMMARY_PATH: ${{ github.step_summary }}
      - name: Upload browser runtime diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harmoniarr-browser-runtime-diagnostic
          path: browser-runtime-diagnostic
          if-no-files-found: warn
          retention-days: 14
