name: Linux Canonical Media Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project-npm
      - name: Require reviewed Linux Engine API before installing or building
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { assertMediaDockerVersion } from './testing/integration/media-docker-endpoint-policy.js';
          const result = execFileSync('docker', ['version', '--format', '{{json .Server}}'], { encoding: 'utf8', timeout: 30000, maxBuffer: 2097152 });
          assertMediaDockerVersion(JSON.parse(result));
          JS
      - run: npm ci
      - name: Build local immutable validation media image
        run: |
          mkdir -p .tmp/linux-canonical-media
          docker build --file testing/docker/canonical-media.Dockerfile --iidfile .tmp/linux-canonical-media/image.iid .
      - name: Run the complete canonical cohort with strict evidence
        run: |
          export HARMONIARR_INTEGRATION_MEDIA_IMAGE="$(cat .tmp/linux-canonical-media/image.iid)"
          npm run validate:linux-canonical-media
