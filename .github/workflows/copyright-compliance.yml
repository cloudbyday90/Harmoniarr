name: Repository Validation

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'logo/**'
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'logo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schema:
    name: Validate Schema Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: harmoniarr
          POSTGRES_PASSWORD: harmoniarr
          POSTGRES_USER: harmoniarr
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U harmoniarr -d harmoniarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up project npm
        uses: ./.github/actions/setup-project-npm
      - name: Install root dependencies
        run: npm ci
      - name: Build server migration tools
        run: npm run build:server
      - name: Prepare source database
        run: npm run prepare:database
        env:
          PGDATABASE: harmoniarr
          PGHOST: 127.0.0.1
          PGMAINTENANCE_DB: postgres
          PGPASSWORD: harmoniarr
          PGPORT: 5432
          PGUSER: harmoniarr
      - name: Check database-backed schema snapshot
        run: npm run db:check-schema
        env:
          PGDATABASE: harmoniarr
          PGHOST: 127.0.0.1
          PGMAINTENANCE_DB: postgres
          PGPASSWORD: harmoniarr
          PGPORT: 5432
          PGUSER: harmoniarr

  validate:
    name: Validate Repository
    needs: validate-schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: harmoniarr
          POSTGRES_PASSWORD: harmoniarr
          POSTGRES_USER: harmoniarr
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U harmoniarr -d harmoniarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up project npm
        uses: ./.github/actions/setup-project-npm
      - name: Install root dependencies
        run: npm ci
      - name: Run repository validation
        run: npm run validate
        env:
          PGDATABASE: harmoniarr
          PGHOST: 127.0.0.1
          PGMAINTENANCE_DB: postgres
          PGPASSWORD: harmoniarr
          PGPORT: 5432
          PGUSER: harmoniarr

  validate-postgres-recovery:
    name: Verify PostgreSQL Recovery Continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up project npm
        uses: ./.github/actions/setup-project-npm
      - name: Install root dependencies
        run: npm ci
      - name: Rehearse generated database dump and restore
        run: node scripts/validate-postgres-recovery.js --evidence-path .tmp/postgres-recovery-evidence.json
      - name: Upload sanitized recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-recovery-evidence
          path: .tmp/postgres-recovery-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  validate-database:
    name: Validate Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: harmoniarr
          POSTGRES_PASSWORD: harmoniarr
          POSTGRES_USER: harmoniarr
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U harmoniarr -d harmoniarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up project npm
        uses: ./.github/actions/setup-project-npm
      - name: Install root dependencies
        run: npm ci
      - name: Replay migrations against disposable Postgres
        run: npm run validate:database
        env:
          PGDATABASE: harmoniarr
          PGHOST: 127.0.0.1
          PGPASSWORD: harmoniarr
          PGPORT: 5432
          PGUSER: harmoniarr
