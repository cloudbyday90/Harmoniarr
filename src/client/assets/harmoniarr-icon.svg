<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" role="img" aria-label="Harmoniarr icon">
  <defs>
    <clipPath id="harmoniarr-tile-clip">
      <rect width="100" height="100" rx="16"/>
    </clipPath>
  </defs>

  <!-- Tile background -->
  <rect width="100" height="100" rx="16" fill="#131825"/>

  <g clip-path="url(#harmoniarr-tile-clip)"
     stroke="#2DD4BF"
     stroke-width="3.5"
     stroke-linecap="round"
     stroke-linejoin="round"
     fill="none">

    <!-- ECG waveform: baseline at y=50, sharp spike just left of the   -->
    <!-- shelf, runs across, small downward notch on the right.          -->
    <polyline points="0,50 22,50 27,50 30,12 33,50 70,50 74,58 78,50 100,50"/>

    <!-- Shelf frame and book spines (filled mint, no stroke) -->
    <g fill="#2DD4BF" stroke="none">
      <rect x="34" y="14" width="3.5" height="74" rx="0.5"/>
      <rect x="62.5" y="14" width="3.5" height="74" rx="0.5"/>
      <rect x="34" y="14" width="32" height="3.5" rx="0.5"/>
      <rect x="34" y="84.5" width="32" height="3.5" rx="0.5"/>
      <rect x="40" y="20" width="8" height="28" rx="0.8"/>
      <rect x="52" y="20" width="8" height="28" rx="0.8"/>
    </g>

    <!-- Download arrow inside the shelf, below the waveform baseline -->
    <line x1="50" y1="58" x2="50" y2="76"/>
    <polyline points="43,69 50,80 57,69"/>

  </g>
</svg>
