<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="760" height="200" role="img" aria-label="Harmoniarr">
  <defs>
    <clipPath id="icon-clip">
      <rect width="100" height="100" rx="18"/>
    </clipPath>
  </defs>

  <!-- Lockup background -->
  <rect width="380" height="100" fill="#0F1117"/>

  <!-- ── Icon tile ─────────────────────────────────────────── -->
  <rect width="100" height="100" rx="18" fill="#131825"/>
  <g clip-path="url(#icon-clip)" stroke="#2DD4BF" fill="#2DD4BF">
    <!-- Uprights -->
    <rect x="33" y="10" width="4" height="80"/>
    <rect x="63" y="10" width="4" height="80"/>
    <!-- Top and bottom boards -->
    <rect x="33" y="10" width="34" height="4"/>
    <rect x="33" y="86" width="34" height="4"/>
    <!-- Books: 2 solid blocks, upper section -->
    <rect x="38" y="16" width="11" height="30"/>
    <rect x="53" y="16" width="11" height="30"/>
    <!-- Acquisition arrow, lower section -->
    <line x1="50" y1="54" x2="50" y2="70" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" fill="none"/>
    <polyline points="42,66 50,78 58,66" stroke="#2DD4BF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ECG waveform -->
    <polyline points="2,50 27,50 34,2 41,50 98,50" stroke="#2DD4BF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── Wordmark ──────────────────────────────────────────── -->
  <text x="122" y="50"
        font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="34"
        font-weight="500"
        letter-spacing="-0.5"
        fill="#2DD4BF"
        dominant-baseline="central">Harmoniarr</text>
</svg>
