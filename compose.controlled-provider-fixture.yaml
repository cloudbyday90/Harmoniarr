services:
  harmoniarr:
    environment:
      CONTROLLED_PROVIDER_API_KEY: ${CONTROLLED_PROVIDER_API_KEY:?Set CONTROLLED_PROVIDER_API_KEY for the controlled provider test}
      HARMONIARR_TEST_DISABLE_BACKGROUND_SERVICES: 'true'
    volumes:
      - "./testing/docker/controlled-provider-fixture-catalog.mjs:/validation/controlled-provider-fixture-catalog.mjs:ro"
      - "./testing/docker/controlled-provider-music-queue-linkage-verifier.mjs:/validation/controlled-provider-music-queue-linkage-verifier.mjs:ro"
      - "./testing/docker/controlled-provider-pipeline-verifier.mjs:/validation/controlled-provider-pipeline-verifier.mjs:ro"

  controlled-provider:
    image: node:24.19.0-alpine
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    environment:
      CONTROLLED_PROVIDER_API_KEY: ${CONTROLLED_PROVIDER_API_KEY:?Set CONTROLLED_PROVIDER_API_KEY for the controlled provider test}
      CONTROLLED_PROVIDER_DOWNLOADS_ROOT: /data/downloads
      PORT: 5030
    volumes:
      - "${HARMONIARR_DOWNLOADS:-/srv/slskd/downloads}:/data/downloads"
      - "./testing/docker/controlled-provider-fixture-catalog.mjs:/fixture/controlled-provider-fixture-catalog.mjs:ro"
      - "./testing/docker/controlled-provider-fixture-server.mjs:/fixture/controlled-provider-fixture-server.mjs:ro"
    command: ["node", "/fixture/controlled-provider-fixture-server.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5030/_fixture/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
